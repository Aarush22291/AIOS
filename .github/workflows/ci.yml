name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  repository-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/roadmap.md
          echo "AIOS repository structure OK"